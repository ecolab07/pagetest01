<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deux boucles causales</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05070b;color:#e8edf5;font:14px system-ui,sans-serif}#graph{position:fixed;inset:0}#ui{position:fixed;left:16px;top:16px;padding:12px 14px;background:#0b1018cc;border:1px solid #273244;border-radius:10px;backdrop-filter:blur(8px)}button{background:#151d2a;color:#e8edf5;border:1px solid #39475c;border-radius:7px;padding:7px 10px;cursor:pointer}.hint{opacity:.65;margin-top:8px;font-size:12px}</style></head><body><div id="graph"></div><div id="ui"><b>Deux boucles simples</b><br><button id="pulse">Injecter une perturbation</button><div id="status" class="hint">A ↔ B · C ↔ D · B → C<br>couleur = identité · taille = énergie · trace = mémoire<br>épaisseur du lien = force causale</div></div><script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script src="https://unpkg.com/3d-force-graph@1.79.0/dist/3d-force-graph.min.js"></script><script>
const nodes=['A','B','C','D'].map(id=>({id,name:id,energy:0,flash:0}));const links=[['A','B',1],['B','A',.8],['C','D',1],['D','C',.8],['B','C',.65]].map(([source,target,w])=>({source,target,w}));
const graph=ForceGraph3D()(document.getElementById('graph')).backgroundColor('#05070b').showNavInfo(false).nodeLabel(n=>n.name).nodeVal(n=>3+n.energy*7).nodeColor(n=>n.flash>.05?'#fff':'#78a7ff').linkDirectionalArrowLength(5).linkDirectionalArrowRelPos(1).linkWidth(l=>1+4*effectiveWeight(l)).linkColor(l=>effectiveWeight(l)>.8?'#ffd166':'#59677f').graphData({nodes,links});
const scene=graph.scene(),molecules=[];const geo=new THREE.SphereGeometry(1.8,12,12);const palette=[0xffc857,0x63d9ff,0xff6fae,0x9cff6b,0xb58cff,0xff8b4d];let serial=0;
function effectiveWeight(l){const source=nodes.find(n=>n.id===(l.source.id||l.source));return l.w*(1+source.energy*3)}
function pulse(id='A',energy=1){const color=palette[serial%palette.length],idLabel='M'+(++serial);const group=new THREE.Group(),mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color}));mesh.add(new THREE.PointLight(color,2,30));group.add(mesh);const trail=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));scene.add(trail);scene.add(group);molecules.push({group,trail,node:id,energy,progress:0,link:null,id:idLabel,color,history:[],loop:id==='A'||id==='B'?'A':'B'});const n=nodes.find(n=>n.id===id);n.flash=1;n.energy=Math.min(1,n.energy+energy*.35)}
function choose(m){const outs=links.filter(l=>(l.source.id||l.source)===m.node);if(!outs.length||m.energy<.06){scene.remove(m.group);scene.remove(m.trail);m.trail.geometry.dispose();m.trail.material.dispose();m.dead=1;return}const l=outs.reduce((best,x)=>effectiveWeight(x)>effectiveWeight(best)?x:best,outs[0]);m.link=l;m.progress=0;m.energy*=l.w}
function rebuildTrail(m){if(m.history.length<2)return;const curve=new THREE.CatmullRomCurve3(m.history);const old=m.trail.geometry;const radius=.12+.12*Math.min(1,m.energy);m.trail.geometry=new THREE.TubeGeometry(curve,Math.max(8,m.history.length),radius,6,false);old.dispose();m.trail.material.opacity=Math.min(.95,.2+m.energy*.75)}
function animate(){for(const m of molecules){if(m.dead)continue;if(!m.link)choose(m);if(m.dead)continue;const a=nodes.find(n=>n.id===(m.link.source.id||m.link.source)),b=nodes.find(n=>n.id===(m.link.target.id||m.link.target));if(a.x==null||b.x==null)continue;m.progress+=.012;const t=m.progress*(2-m.progress);m.group.position.lerpVectors(new THREE.Vector3(a.x,a.y,a.z),new THREE.Vector3(b.x,b.y,b.z),t);m.group.scale.setScalar(.65+2.35*Math.min(1,m.energy));m.history.push(m.group.position.clone());if(m.history.length>36)m.history.shift();rebuildTrail(m);const impact=m.energy*(m.progress>.85?1:.35);b.energy=Math.min(1,b.energy+impact*.018);b.flash=Math.max(b.flash,impact);if(m.progress>=1){const previous=m.node;m.node=b.id;m.link=null;if(previous==='B'&&b.id==='C'){m.loop='B';b.flash=1;document.getElementById('status').innerHTML=m.id+' : <b>sortie de la boucle A → boucle B</b><br>la perturbation a renforcé B → C';}else if(previous==='C'&&b.id==='D'){m.loop='B'}}}
for(let i=molecules.length-1;i>=0;i--)if(molecules[i].dead)molecules.splice(i,1);nodes.forEach(n=>{n.energy*=.94;n.flash*=.9});graph.nodeVal(n=>3+n.energy*7).nodeColor(n=>n.flash>.05?'#fff':'#78a7ff').linkWidth(l=>1+4*effectiveWeight(l)).linkColor(l=>effectiveWeight(l)>.8?'#ffd166':'#59677f');requestAnimationFrame(animate)}
document.getElementById('pulse').onclick=()=>pulse();graph.onNodeClick(n=>pulse(n.id));pulse('A');pulse('C');animate();
</script></body></html>
