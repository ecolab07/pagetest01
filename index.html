<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boucles causales</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05070b;color:#e8edf5;font:14px system-ui,sans-serif}#graph{position:fixed;inset:0}#ui{position:fixed;left:16px;top:16px;padding:12px 14px;background:#0b1018cc;border:1px solid #273244;border-radius:10px;backdrop-filter:blur(8px)}button{background:#151d2a;color:#e8edf5;border:1px solid #39475c;border-radius:7px;padding:7px 10px;cursor:pointer}.hint{opacity:.65;margin-top:8px;font-size:12px}</style></head><body><div id="graph"></div><div id="ui"><b>Feedback loops</b><br><button id="pulse">Injecter une perturbation</button><div class="hint">clic = perturbation · glisser = caméra · molette = zoom</div></div><script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script src="https://unpkg.com/3d-force-graph@1.79.0/dist/3d-force-graph.min.js"></script><script>
const nodes=['A','B','C','D','E','F','G','H'].map(id=>({id,name:id,energy:0,flash:0}));const links=[['A','B',1],['B','C',.9],['C','D',1],['D','A',.8],['E','F',1],['F','G',.8],['G','H',1],['H','E',.7],['B','F',.65],['G','C',.55]].map(([source,target,w])=>({source,target,w}));
const graph=ForceGraph3D()(document.getElementById('graph')).backgroundColor('#05070b').showNavInfo(false).nodeLabel(n=>n.name).nodeVal(n=>3+n.energy*7).nodeColor(n=>n.flash>.05?'#fff':'#78a7ff').linkDirectionalArrowLength(5).linkDirectionalArrowRelPos(1).linkWidth(1).graphData({nodes,links});
const scene=graph.scene(),molecules=[];const geo=new THREE.SphereGeometry(1.8,12,12);
function pulse(id='A',energy=1){const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xffc857}));const light=new THREE.PointLight(0xffc857,2,30);mesh.add(light);scene.add(mesh);molecules.push({mesh,node:id,energy,progress:0,link:null});nodes.find(n=>n.id===id).flash=1}
function choose(m){const outs=links.filter(l=>(l.source.id||l.source)===m.node);if(!outs.length||m.energy<.06){scene.remove(m.mesh);m.dead=1;return}const l=outs[Math.floor(Math.random()*outs.length)];m.link=l;m.progress=0;m.energy*=l.w}
function animate(){for(const m of molecules){if(m.dead)continue;if(!m.link)choose(m);if(m.dead)continue;const a=nodes.find(n=>n.id===(m.link.source.id||m.link.source)),b=nodes.find(n=>n.id===(m.link.target.id||m.link.target));if(a.x==null||b.x==null)continue;m.progress+=.012;const t=m.progress*(2-m.progress);m.mesh.position.lerpVectors(new THREE.Vector3(a.x,a.y,a.z),new THREE.Vector3(b.x,b.y,b.z),t);b.energy=Math.max(b.energy,m.energy);b.flash=Math.max(b.flash,m.energy);if(m.progress>=1){m.node=b.id;m.link=null}}for(let i=molecules.length-1;i>=0;i--)if(molecules[i].dead)molecules.splice(i,1);nodes.forEach(n=>{n.energy*=.94;n.flash*=.9});graph.nodeVal(n=>3+n.energy*7).nodeColor(n=>n.flash>.05?'#fff':'#78a7ff');requestAnimationFrame(animate)}
document.getElementById('pulse').onclick=()=>pulse();graph.onNodeClick(n=>pulse(n.id));animate();
</script></body></html>
